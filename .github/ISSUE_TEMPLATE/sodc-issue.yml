name: SODC Issue
description: Standard issue for SODC NextGen (bug, feature, enhancement, task)
title: "[SODC] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this template for all SODC NextGen issues. Write in **English** when possible.
        Repository: https://github.com/GaSalRUAG/SODC_NextGen

  - type: dropdown
    id: issue_type
    attributes:
      label: Issue type
      description: What kind of issue is this?
      options:
        - Bug
        - Feature
        - Enhancement
        - Refactor
        - Task
        - Documentation
        - Performance
        - Security
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Estimated impact (can be adjusted during triage)
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Short professional explanation of the issue.
      placeholder: e.g. Obstacle markers on the map are too small and hard to distinguish.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the issue or need clearly.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: Current Behavior
      description: What happens today? Use N/A for feature requests if not applicable.
    validations:
      required: false

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps To Reproduce
      description: Numbered steps to reproduce (bugs). Use N/A if not applicable.
      placeholder: |
        1.
        2.
        3.
      value: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Testable checklist items (use markdown checkboxes).
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: technical_notes
    attributes:
      label: Technical Notes
      description: Optional — files, components, assumptions, implementation hints.
      placeholder: e.g. MapView.jsx, obstacles-circles layer, circle-radius interpolate stops
    validations:
      required: false

  - type: checkboxes
    id: area
    attributes:
      label: Area (optional)
      description: Select all that apply
      options:
        - label: frontend
        - label: ui
        - label: map / MapLibre
        - label: import (KMZ / AIXM)
        - label: obstacles
        - label: performance
        - label: documentation

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
